<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puffer Pond</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230e2f42'/%3E%3Ccircle cx='14' cy='15' r='7' fill='%23b9d77a'/%3E%3Ccircle cx='17' cy='13' r='1.5' fill='%230b232d'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="scene.css" />
  </head>
  <body>
    <main class="pond-scene" id="pond-scene">
      <img
        class="pond-scene__background"
        src="public/assets/pond-environment.png"
        alt="Calm watercolor pond scene with plants and drifting branches"
      />
      <div
        class="pond-scene__waterline"
        aria-hidden="true"
      ></div>
      <section
        class="pond-scene__underwater"
        id="underwater"
        aria-label="Underwater pond"
      ></section>
      <p class="pond-scene__credit">
        Pond, puffer, and snail imagery from Kayden Clark under MIT License.
        <a href="public/assets/LICENSE">Artwork license</a>.
      </p>
    </main>
    <script type="module" src="scene.js"></script>
  </body>
</html>
